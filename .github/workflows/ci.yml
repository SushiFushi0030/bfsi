name: Verify public source
on: [push, pull_request]
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.txt && python -m pip install .
      - run: python scripts/check_install.py
      - run: python scripts/check_public.py
      - run: python scripts/demo.py --check
      - run: python -B -m unittest discover -s tests -v
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build && pnpm --dir web run verify:data
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web run test:browser
      - run: pnpm --dir web run test:live
        env:
          BFSI_PYTHON: python
